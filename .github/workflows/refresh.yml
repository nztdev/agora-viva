name: Refresh news data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI
  push:
    branches: [main]           # also run on deploy so first boot works

permissions:
  contents: write              # needed to commit data.json back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser python-dateutil numpy

      - name: Fetch and cluster news
        run: python scripts/fetch.py
        env:
          # Optional: set in GitHub Secrets for better HN/Reddit rate limits
          # No keys needed for basic RSS + HN operation
          MAX_EVENTS: 60
          DECAY_HALF_LIFE_HOURS: 12

      - name: Commit data.json if changed
        run: |
          git config user.name  "resonance-bot"
          git config user.email "bot@agoraviva.news"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "chore: refresh news data [skip ci]"
          git push
