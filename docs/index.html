<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora Viva — The Living Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090d;
  --surface: #0c1016;
  --border: rgba(255,255,255,0.07);
  --text: #cdd8e8;
  --muted: rgba(205,216,232,0.42);
  --accent: #4af4c2;
  --warm: #f4884a;
  --violet: #a78bfa;
  --left: #6ea8fe;
  --right: #f4764a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden}

/* ── BACKGROUND ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:flex-start;justify-content:space-between;padding:22px 28px;background:linear-gradient(to bottom,rgba(7,9,13,0.96) 55%,transparent);pointer-events:none}
#brand{}
#wordmark{font-size:15px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);line-height:1}
#wordmark span{color:var(--accent)}
#tagline{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:0.08em;margin-top:4px}
#live{display:flex;align-items:center;gap:8px;pointer-events:all}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:ldot 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes ldot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.35;transform:scale(0.65)}}
#ltext{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}

/* ── MAIN SVG ── */
#canvas{position:fixed;inset:0;z-index:1}
svg#graph{width:100%;height:100%}

/* ── EDGES ── */
.edge{stroke-width:1;fill:none;transition:stroke-opacity 0.4s,stroke-width 0.3s}
.edge.hi{stroke-width:1.5}

/* ── NODES ── */
.ng{cursor:pointer}
/* glow filter applied per-node via inline filter attr */
.nring{fill:none;opacity:0;transition:opacity 0.25s;stroke-width:1.5}
.ng:hover .nring,.ng.sel .nring{opacity:1}
.npulse{fill:none;pointer-events:none}
.ncore{transition:filter 0.3s}
.ng.sel .ncore{filter:brightness(1.6) saturate(1.3)}
.nlabel{font-family:'Syne',sans-serif;font-weight:500;fill:rgba(205,216,232,0.7);pointer-events:none;text-anchor:middle;dominant-baseline:hanging}
.ng:hover .nlabel,.ng.sel .nlabel{fill:#fff}
.ncategory{font-family:'DM Mono',monospace;pointer-events:none;text-anchor:middle;dominant-baseline:auto;text-transform:uppercase;letter-spacing:0.12em}

/* ── PANEL ── */
#panel{position:fixed;right:0;top:0;bottom:0;width:360px;background:rgba(10,14,20,0.97);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.42s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;z-index:200;overflow:hidden;backdrop-filter:blur(24px)}
#panel.open{transform:translateX(0)}
#phead{padding:52px 24px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
#pevent{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
#ptitle{font-size:17px;font-weight:700;line-height:1.38;color:var(--text);margin-bottom:14px}
#pmeta{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.ac{border-color:rgba(74,244,194,0.32);color:var(--accent)}
.pill.wm{border-color:rgba(244,136,74,0.32);color:var(--warm)}
#pclose{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;transition:border-color 0.2s,color 0.2s;display:flex;align-items:center;justify-content:center}
#pclose:hover{border-color:rgba(255,255,255,0.22);color:var(--text)}

/* resonance section */
#pres{padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.slabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rtrack{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:4px}
.rfill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--accent));transition:width 0.9s cubic-bezier(0.16,1,0.3,1)}
#rscore{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);margin-top:4px}

/* bias section */
#pbias{padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.btrack{position:relative;height:4px;background:linear-gradient(90deg,var(--left) 0%,rgba(255,255,255,0.08) 50%,var(--right) 100%);border-radius:2px;margin:8px 0 6px}
.bmark{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--bg);transition:left 0.6s cubic-bezier(0.16,1,0.3,1)}
.brow{display:flex;justify-content:space-between;align-items:center}
.bside{font-family:'DM Mono',monospace;font-size:9px}
#bverdict{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}

/* geographic spread */
#pgeo{padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
#geobar{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.georegion{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.georegion.global{border-color:rgba(74,244,194,0.3);color:var(--accent)}

/* sources */
#psrc{flex:1;overflow-y:auto;padding:14px 24px 24px}
#psrc::-webkit-scrollbar{width:3px}
#psrc::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.si{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);text-decoration:none;transition:opacity 0.18s}
.si:last-child{border-bottom:none}
.si:hover{opacity:0.68}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sb{flex:1;min-width:0}
.sout{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:3px}
.shed{font-size:12px;color:var(--text);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── FILTERS ── */
#filters{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(12,16,22,0.94);border:1px solid var(--border);border-radius:40px;padding:5px 8px;backdrop-filter:blur(16px);z-index:100}
.fb{background:none;border:1px solid transparent;color:var(--muted);padding:5px 13px;border-radius:20px;cursor:pointer;transition:all 0.18s;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.04em}
.fb:hover{color:var(--text);border-color:var(--border)}
.fb.on{color:var(--accent);border-color:rgba(74,244,194,0.28)}
.fsep{width:1px;height:14px;background:var(--border);margin:0 2px;flex-shrink:0}

/* ── LEGEND ── */
#legend{position:fixed;bottom:76px;left:26px;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);z-index:100;line-height:2.4;pointer-events:none}
.lr{display:flex;align-items:center;gap:8px}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ll{width:18px;height:1px;flex-shrink:0}

/* ── TOOLTIP ── */
#tt{position:fixed;z-index:400;pointer-events:none;background:rgba(10,14,20,0.97);border:1px solid var(--border);border-radius:10px;padding:11px 15px;max-width:230px;opacity:0;transition:opacity 0.12s;backdrop-filter:blur(12px)}
#tt.on{opacity:1}
#ttt{font-size:12px;color:var(--text);line-height:1.42;margin-bottom:5px}
#ttr{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)}

/* ── LOADING ── */
#loading{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 0.7s}
#loading.gone{opacity:0;pointer-events:none}
#lbrand{font-size:11px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);font-family:'Syne',sans-serif}
#lbrand span{color:var(--accent)}
.lbar{width:160px;height:1px;background:rgba(255,255,255,0.07);overflow:hidden;border-radius:1px}
.lfill{height:100%;background:var(--accent);animation:lsweep 2s ease-in-out infinite}
@keyframes lsweep{0%{width:0;margin-left:0}50%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}
#lsub{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.1em}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="loading">
  <div id="lbrand">Agora <span>Viva</span></div>
  <div class="lbar"><div class="lfill"></div></div>
  <div id="lsub">reading the field…</div>
</div>

<div id="hdr">
  <div id="brand">
    <div id="wordmark">Agora <span>Viva</span></div>
    <div id="tagline">the field is alive · v0.1</div>
  </div>
  <div id="live"><div class="ldot"></div><span id="ltext">connecting…</span></div>
</div>

<div id="canvas"><svg id="graph">
  <defs>
    <filter id="glow-hi" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="el"></g>
  <g id="nl"></g>
</svg></div>

<div id="legend">
  <div class="lr"><div class="ld" style="background:var(--accent)"></div>high resonance</div>
  <div class="lr"><div class="ld" style="background:var(--violet)"></div>moderate</div>
  <div class="lr"><div class="ld" style="background:rgba(205,216,232,0.22)"></div>low resonance</div>
  <div class="lr"><div class="ll" style="background:rgba(205,216,232,0.1)"></div>related events</div>
</div>

<div id="filters">
  <button class="fb on" data-f="all">the field</button>
  <div class="fsep"></div>
  <button class="fb" data-f="rss">press</button>
  <button class="fb" data-f="hn">tech</button>
  <div class="fsep"></div>
  <button class="fb" data-f="top">top 20</button>
</div>

<div id="tt"><div id="ttt"></div><div id="ttr"></div></div>

<div id="panel">
  <button id="pclose" onclick="closePanel()">✕</button>
  <div id="phead">
    <div id="pevent">Event</div>
    <div id="ptitle">—</div>
    <div id="pmeta"></div>
  </div>
  <div id="pres">
    <div class="slabel">Resonance</div>
    <div class="rtrack"><div class="rfill" id="rbar" style="width:0%"></div></div>
    <div id="rscore">—</div>
  </div>
  <div id="pbias">
    <div class="slabel">Coverage spectrum</div>
    <div class="btrack"><div class="bmark" id="bmark" style="left:50%"></div></div>
    <div class="brow">
      <span class="bside" style="color:var(--left)">left</span>
      <span id="bverdict">—</span>
      <span class="bside" style="color:var(--right)">right</span>
    </div>
  </div>
  <div id="pgeo">
    <div class="slabel">Geographic reach</div>
    <div id="geobar"></div>
  </div>
  <div id="psrc">
    <div class="slabel" style="margin-bottom:10px">Sources (<span id="scount">0</span>)</div>
    <div id="slist"></div>
  </div>
</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const PC = { rss:'#4af4c2', hackernews:'#f4884a', default:'#a78bfa' };
const ALPHA_START = 1.0, ALPHA_MIN = 0.004, ALPHA_DECAY = 0.018, ALPHA_REHEAT = 0.28, DAMPING = 0.76;

// ── STATE ─────────────────────────────────────────────────────────────────────
let nodes=[], edges=[], fnodes=[], fedges=[];
let pos={}, vel={}, W, H, alpha=ALPHA_START, af=null, selId=null, _lastGen=null;

// ── BACKGROUND PARTICLE FIELD ─────────────────────────────────────────────────
// Subtle ambient particles that drift slowly, giving depth to the dark bg
const bgc = document.getElementById('bg-canvas');
const bgx = bgc.getContext('2d');
let particles = [];

function initBg() {
  bgc.width = window.innerWidth; bgc.height = window.innerHeight;
  particles = Array.from({length: 55}, () => ({
    x: Math.random() * bgc.width, y: Math.random() * bgc.height,
    r: Math.random() * 1.2 + 0.3,
    vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
    o: Math.random() * 0.25 + 0.05
  }));
}

function drawBg() {
  bgx.clearRect(0, 0, bgc.width, bgc.height);
  // Very subtle radial vignette
  const gr = bgx.createRadialGradient(bgc.width/2, bgc.height/2, bgc.height*0.1, bgc.width/2, bgc.height/2, bgc.height*0.8);
  gr.addColorStop(0, 'rgba(15,22,35,0)');
  gr.addColorStop(1, 'rgba(4,6,10,0.6)');
  bgx.fillStyle = gr; bgx.fillRect(0, 0, bgc.width, bgc.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = bgc.width; if (p.x > bgc.width) p.x = 0;
    if (p.y < 0) p.y = bgc.height; if (p.y > bgc.height) p.y = 0;
    bgx.beginPath(); bgx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    bgx.fillStyle = `rgba(74,244,194,${p.o})`; bgx.fill();
  });
  requestAnimationFrame(drawBg);
}

// ── DATA ──────────────────────────────────────────────────────────────────────
async function boot() {
  initBg(); drawBg();
  try {
    const r = await fetch('data.json');
    if (!r.ok) throw 0;
    const d = await r.json();
    nodes = d.nodes||[]; edges = d.edges||[]; _lastGen = d.generated_at;
    const ago = Math.round((Date.now()-new Date(d.generated_at))/60000);
    document.getElementById('ltext').textContent = `${nodes.length} events · ${ago < 2 ? 'just now' : ago+'m ago'}`;
  } catch {
    makeDemoData();
    document.getElementById('ltext').textContent = 'demo · no data.json yet';
  }
  filter('all');
  document.getElementById('loading').classList.add('gone');
  // Poll for updates every 5 minutes
  setInterval(async () => {
    try {
      const r = await fetch('data.json?t='+Date.now());
      if (!r.ok) return;
      const d = await r.json();
      if (d.generated_at === _lastGen) return;
      _lastGen = d.generated_at; nodes = d.nodes||[]; edges = d.edges||[];
      const ago = Math.round((Date.now()-new Date(d.generated_at))/60000);
      document.getElementById('ltext').textContent = `${nodes.length} events · ${ago}m ago`;
      filter(document.querySelector('.fb.on')?.dataset?.f||'all');
      reheat();
    } catch {}
  }, 5*60*1000);
}

function makeDemoData() {
  const ev = [
    ['Global protests surge over economic inequality', 0.91, ['BBC News','Guardian','Al Jazeera','Reuters','Fox News'], -0.12, 0.58, ['rss'], ['Global','Europe','Americas']],
    ['Central banks signal coordinated rate policy shift', 0.74, ['Reuters','WSJ','FT','BBC News'], 0.08, 0.19, ['rss','hackernews'], ['Global','Americas','Europe']],
    ['AI regulation framework proposed by coalition', 0.68, ['The Verge','Ars Technica','TechCrunch','Guardian'], -0.08, 0.24, ['rss','hackernews'], ['Global','Americas','Europe','Asia']],
    ['Tech giants face antitrust scrutiny in three jurisdictions', 0.62, ['WSJ','Guardian','TechCrunch','Reuters'], 0.04, 0.36, ['rss','hackernews'], ['Americas','Europe']],
    ['Solid-state battery breakthrough announced', 0.57, ['Ars Technica','The Verge','Nature'], -0.04, 0.10, ['rss','hackernews'], ['Americas','Asia']],
    ['Middle East peace process enters critical phase', 0.53, ['BBC News','Al Jazeera','Reuters','Fox News'], 0.18, 0.62, ['rss'], ['Middle East','Europe','Americas']],
    ['Crewed lunar mission destination revealed', 0.47, ['Ars Technica','BBC News','Reuters'], -0.04, 0.11, ['rss','hackernews'], ['Americas','Global']],
    ['Food security report warns of supply disruptions', 0.43, ['Guardian','BBC News','Al Jazeera'], -0.18, 0.16, ['rss'], ['Africa','Asia','Global']],
    ['Cybersecurity incident hits financial infrastructure', 0.40, ['Ars Technica','WSJ','Reuters'], 0.0, 0.14, ['rss','hackernews'], ['Americas','Europe']],
    ['Asia-Pacific trade agreement reshapes commerce', 0.36, ['Reuters','WSJ','BBC News'], 0.04, 0.18, ['rss'], ['Asia','Americas']],
    ['Cancer immunotherapy advance announced', 0.33, ['Guardian','Nature','BBC News'], -0.08, 0.07, ['rss'], ['Global']],
    ['Platform overhauls content moderation policy', 0.29, ['Guardian','TechCrunch','Verge','Fox News'], -0.08, 0.44, ['rss','hackernews'], ['Americas','Europe']],
    ['Open-source model outperforms closed alternatives', 0.26, ['Ars Technica','TechCrunch','HN'], 0.0, 0.08, ['hackernews'], ['Global']],
    ['Earthquake relief operations continue', 0.23, ['BBC News','Al Jazeera','Reuters'], -0.04, 0.20, ['rss'], ['Asia','Global']],
    ['Digital currency pilot expands to new countries', 0.19, ['Reuters','WSJ','BBC News'], 0.08, 0.13, ['rss','hackernews'], ['Asia','Americas','Europe']],
    ['Clean energy investment hits annual record', 0.16, ['Guardian','Reuters','BBC News'], -0.14, 0.09, ['rss'], ['Global','Europe']],
    ['Diplomatic talks stall over maritime territory', 0.13, ['BBC News','Al Jazeera','WSJ'], 0.0, 0.28, ['rss'], ['Asia','Global']],
    ['Pharmaceutical merger reshapes supply chain', 0.10, ['Reuters','WSJ','Guardian'], 0.12, 0.16, ['rss'], ['Americas','Europe']],
  ];
  const omap = {rss:'rss',hackernews:'hackernews'};
  nodes = ev.map(([t,res,srcs,bm,bs,plat,geo],i)=>({
    id:'d'+i, title:t,
    resonance: Math.max(0.04, res * Math.pow(0.5, (Math.random()*6)/12)),
    signal_count: srcs.length,
    platforms: plat, geo_regions: geo,
    bias:{ mean: bm+(Math.random()-.5)*0.06, spread: bs+(Math.random()-.5)*0.04 },
    sources: srcs.map((o,j)=>({ outlet:o, headline:t+(j===0?'':' — further coverage'), url:'#', platform:j===0&&plat.includes('hackernews')?'hackernews':'rss' })),
    last_seen: new Date(Date.now()-Math.random()*7200000).toISOString(),
    first_seen: new Date(Date.now()-Math.random()*86400000).toISOString(),
  }));
  edges=[];
  const rel=[[0,5],[0,7],[1,9],[1,14],[2,3],[2,11],[2,12],[3,11],[4,14],[6,4],[8,2],[10,7],[12,2],[13,5],[15,0],[16,5]];
  rel.forEach(([a,b])=>{
    if(a<nodes.length&&b<nodes.length)
      edges.push({source:nodes[a].id,target:nodes[b].id,weight:+(Math.random()*0.4+0.15).toFixed(3),type:'thematic'});
  });
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function filter(f) {
  let n = nodes;
  if (f==='rss') n = n.filter(x=>x.platforms?.includes('rss')&&!x.platforms?.includes('hackernews'));
  else if (f==='hn') n = n.filter(x=>x.platforms?.includes('hackernews'));
  else if (f==='top') n = [...n].sort((a,b)=>b.resonance-a.resonance).slice(0,20);
  const ids = new Set(n.map(x=>x.id));
  fnodes = n; fedges = edges.filter(e=>ids.has(e.source)&&ids.has(e.target));
  render();
}

// ── NODE HELPERS ──────────────────────────────────────────────────────────────
function nr(n) { return 6 + (n.resonance||0) * 38; }

function nodeColor(n) {
  const r = n.resonance||0;
  if (r > 0.55) return {core:'#4af4c2', ring:'rgba(74,244,194,0.18)', glow:'glow-hi'};
  if (r > 0.30) return {core:'#a78bfa', ring:'rgba(167,139,250,0.16)', glow:'glow-md'};
  return {core:'rgba(205,216,232,0.35)', ring:'rgba(205,216,232,0.08)', glow:'glow-lo'};
}

// ── SIMULATION ────────────────────────────────────────────────────────────────
function initPos() {
  W = window.innerWidth; H = window.innerHeight;
  pos={}; vel={};
  fnodes.forEach((n,i) => {
    const a = (i/fnodes.length)*Math.PI*2 + (Math.random()-.5)*0.5;
    const maxR = Math.min(W,H)*0.36;
    const rd = maxR * (1 - (n.resonance||0)*0.68);
    pos[n.id] = { x: W/2+rd*Math.cos(a)+(Math.random()-.5)*30, y: H/2+rd*Math.sin(a)+(Math.random()-.5)*30 };
    vel[n.id] = { x:0, y:0 };
  });
}

function tick() {
  if (alpha <= 0) return;
  const em={};
  fedges.forEach(e=>{
    (em[e.source]||(em[e.source]=[])).push({id:e.target,w:e.weight});
    (em[e.target]||(em[e.target]=[])).push({id:e.source,w:e.weight});
  });
  fnodes.forEach(a => {
    const pa=pos[a.id]; if(!pa) return;
    let fx=0, fy=0;
    // Resonance gravity — stronger pull to center for high-resonance nodes
    const res = a.resonance||0;
    const g = 0.006 + res*0.024;
    fx += (W/2 - pa.x)*g;
    fy += (H/2 - pa.y)*g;
    // Repulsion
    fnodes.forEach(b => {
      if (a.id===b.id) return;
      const pb=pos[b.id]; if(!pb) return;
      const dx=pa.x-pb.x, dy=pa.y-pb.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const md=(nr(a)+nr(b))*2.7+46;
      if (d<md) { const f=(md-d)/d*0.33; fx+=dx*f; fy+=dy*f; }
    });
    // Edge attraction
    (em[a.id]||[]).forEach(({id,w}) => {
      const pb=pos[id]; if(!pb) return;
      const dx=pb.x-pa.x, dy=pb.y-pa.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-(100+w*85))/d*w*0.052;
      fx+=dx*f; fy+=dy*f;
    });
    const v=vel[a.id];
    v.x=(v.x+fx*alpha)*DAMPING; v.y=(v.y+fy*alpha)*DAMPING;
    pa.x=Math.max(65,Math.min(W-65,pa.x+v.x));
    pa.y=Math.max(65,Math.min(H-65,pa.y+v.y));
  });
  alpha = Math.max(0, alpha-ALPHA_DECAY);
}

function reheat() { alpha = Math.max(alpha, ALPHA_REHEAT); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  if (af) cancelAnimationFrame(af);
  alpha = ALPHA_START;
  initPos();
  for (let i=0;i<200;i++) tick(); // headless pre-settle
  alpha = ALPHA_START;
  draw();
  (function loop() {
    if (alpha > ALPHA_MIN) { tick(); updatePositions(); }
    af = requestAnimationFrame(loop);
  })();
}

function draw() {
  const NS = 'http://www.w3.org/2000/svg';
  const el = document.getElementById('el'), nl = document.getElementById('nl');
  el.innerHTML=''; nl.innerHTML='';

  // Edges
  fedges.forEach(e => {
    const pa=pos[e.source], pb=pos[e.target]; if(!pa||!pb) return;
    const ln = document.createElementNS(NS,'line');
    ln.id='e-'+e.source+'-'+e.target; ln.classList.add('edge');
    ln.setAttribute('x1',pa.x);ln.setAttribute('y1',pa.y);
    ln.setAttribute('x2',pb.x);ln.setAttribute('y2',pb.y);
    ln.style.stroke='rgba(74,244,194,'+(0.06+e.weight*0.18)+')';
    ln.style.strokeOpacity='1';
    el.appendChild(ln);
  });

  // Nodes
  fnodes.forEach(n => {
    const p=pos[n.id], r=nr(n);
    const col = nodeColor(n);
    const g = document.createElementNS(NS,'g');
    g.classList.add('ng'); g.id='n-'+n.id;
    if (n.id===selId) g.classList.add('sel');

    // Outer pulse ring (high resonance only)
    if (n.resonance > 0.42) {
      const pu = document.createElementNS(NS,'circle');
      pu.classList.add('npulse');
      pu.setAttribute('cx',p.x);pu.setAttribute('cy',p.y);
      pu.style.stroke = col.core;
      pu.style.animationName = 'none'; // drive via JS for varied timing
      pu.setAttribute('r',0);
      // Staggered pulse via CSS animation clone
      const anim = document.createElementNS(NS,'animate');
      anim.setAttribute('attributeName','r');
      anim.setAttribute('values','0;'+(r+30)+';'+(r+52));
      anim.setAttribute('dur', (2.8+Math.random()*1.4)+'s');
      anim.setAttribute('repeatCount','indefinite');
      anim.setAttribute('begin',(Math.random()*3)+'s');
      const anim2 = document.createElementNS(NS,'animate');
      anim2.setAttribute('attributeName','opacity');
      anim2.setAttribute('values','0.45;0.15;0');
      anim2.setAttribute('dur', (2.8+Math.random()*1.4)+'s');
      anim2.setAttribute('repeatCount','indefinite');
      anim2.setAttribute('begin',(Math.random()*3)+'s');
      pu.appendChild(anim); pu.appendChild(anim2);
      pu.style.fill='none'; pu.style.strokeWidth='1';
      g.appendChild(pu);
    }

    // Second concentric ring for very high resonance
    if (n.resonance > 0.65) {
      const pu2 = document.createElementNS(NS,'circle');
      pu2.classList.add('npulse');
      pu2.setAttribute('cx',p.x);pu2.setAttribute('cy',p.y);
      pu2.style.stroke = col.core; pu2.style.fill='none'; pu2.style.strokeWidth='1';
      const a1=document.createElementNS(NS,'animate');
      a1.setAttribute('attributeName','r');a1.setAttribute('values','0;'+(r+18)+';'+(r+38));
      a1.setAttribute('dur','2.1s');a1.setAttribute('repeatCount','indefinite');a1.setAttribute('begin','1.4s');
      const a2=document.createElementNS(NS,'animate');
      a2.setAttribute('attributeName','opacity');a2.setAttribute('values','0.55;0.2;0');
      a2.setAttribute('dur','2.1s');a2.setAttribute('repeatCount','indefinite');a2.setAttribute('begin','1.4s');
      pu2.appendChild(a1);pu2.appendChild(a2);
      g.appendChild(pu2);
    }

    // Hover ring
    const ring = document.createElementNS(NS,'circle');
    ring.classList.add('nring');
    ring.setAttribute('cx',p.x);ring.setAttribute('cy',p.y);ring.setAttribute('r',r+8);
    ring.style.stroke = col.ring; ring.style.strokeWidth='1.5';
    g.appendChild(ring);

    // Core circle with glow
    const core = document.createElementNS(NS,'circle');
    core.classList.add('ncore');
    core.setAttribute('cx',p.x);core.setAttribute('cy',p.y);core.setAttribute('r',r);
    core.style.fill = col.core;
    core.setAttribute('filter','url(#'+col.glow+')');
    g.appendChild(core);

    // Inner highlight (small bright spot, top-left)
    if (r > 10) {
      const hi = document.createElementNS(NS,'circle');
      hi.setAttribute('cx', p.x - r*0.28); hi.setAttribute('cy', p.y - r*0.28);
      hi.setAttribute('r', r*0.22);
      hi.style.fill = 'rgba(255,255,255,0.12)'; hi.style.pointerEvents='none';
      g.appendChild(hi);
    }

    // Label
    if (r > 9) {
      const words = n.title.split(' ');
      let l1='', l2='';
      words.forEach(w => { if ((l1+w).length<=22) l1+=(l1?' ':'')+w; else l2+=(l2?' ':'')+w; });
      if (l2.length>22) l2=l2.slice(0,21)+'…';
      const lbl = document.createElementNS(NS,'text');
      lbl.classList.add('nlabel');
      lbl.setAttribute('x',p.x); lbl.setAttribute('y',p.y+r+7);
      lbl.style.fontSize = r>20 ? '11px' : '9.5px';
      const t1=document.createElementNS(NS,'tspan');
      t1.setAttribute('x',p.x); t1.textContent=l1; lbl.appendChild(t1);
      if (l2) {
        const t2=document.createElementNS(NS,'tspan');
        t2.setAttribute('x',p.x); t2.setAttribute('dy','1.3em'); t2.textContent=l2; lbl.appendChild(t2);
      }
      g.appendChild(lbl);
    }

    g.addEventListener('mouseenter', e=>showTip(n,e));
    g.addEventListener('mouseleave', ()=>document.getElementById('tt').classList.remove('on'));
    g.addEventListener('click', ()=>selectNode(n));
    nl.appendChild(g);
  });
}

function updatePositions() {
  fnodes.forEach(n => {
    const p=pos[n.id], g=document.getElementById('n-'+n.id);
    if (!g||!p) return;
    const r=nr(n);
    g.querySelectorAll('circle').forEach(c=>{c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);});
    // Re-place inner highlight offset
    const circles=[...g.querySelectorAll('circle')];
    const hiC=circles[circles.length-2]; // second to last before label if r>10
    // (highlight reposition handled implicitly since cx/cy set above — offset baked in on draw)
    const lbl=g.querySelector('text');
    if (lbl) {
      lbl.setAttribute('x',p.x); lbl.setAttribute('y',p.y+r+7);
      lbl.querySelectorAll('tspan').forEach(t=>t.setAttribute('x',p.x));
    }
  });
  fedges.forEach(e=>{
    const ln=document.getElementById('e-'+e.source+'-'+e.target);
    const pa=pos[e.source], pb=pos[e.target];
    if (ln&&pa&&pb){ln.setAttribute('x1',pa.x);ln.setAttribute('y1',pa.y);ln.setAttribute('x2',pb.x);ln.setAttribute('y2',pb.y);}
  });
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
function showTip(n,e){
  document.getElementById('ttt').textContent=n.title;
  document.getElementById('ttr').textContent=
    `resonance ${(n.resonance*100).toFixed(0)}  ·  ${n.signal_count} source${n.signal_count!==1?'s':''}`;
  document.getElementById('tt').classList.add('on');
  moveTip(e);
}
document.addEventListener('mousemove',e=>{
  if(document.getElementById('tt').classList.contains('on')) moveTip(e);
});
function moveTip(e){
  const t=document.getElementById('tt');
  let x=e.clientX+18, y=e.clientY+14;
  if(x+250>window.innerWidth) x=e.clientX-250;
  if(y+100>window.innerHeight) y=e.clientY-90;
  t.style.left=x+'px'; t.style.top=y+'px';
}

// ── NODE SELECTION ────────────────────────────────────────────────────────────
function selectNode(n){
  document.querySelectorAll('.ng.sel').forEach(g=>g.classList.remove('sel'));
  document.querySelectorAll('.edge.hi').forEach(e=>e.classList.remove('hi'));
  if (selId===n.id){selId=null;closePanel();return;}
  selId=n.id;
  document.getElementById('n-'+n.id)?.classList.add('sel');
  fedges.forEach(e=>{
    if(e.source===n.id||e.target===n.id){
      const ln=document.getElementById('e-'+e.source+'-'+e.target);
      if(ln){ln.classList.add('hi');ln.style.stroke='rgba(74,244,194,0.45)';ln.style.strokeWidth='1.5';}
    }
  });
  openPanel(n);
}

// ── PANEL ─────────────────────────────────────────────────────────────────────
function openPanel(n){
  document.getElementById('ptitle').textContent = n.title;

  // Meta pills
  const m=document.getElementById('pmeta'); m.innerHTML='';
  const ago=Math.round((Date.now()-new Date(n.last_seen))/60000);
  addPill(m, ago<2?'just now':ago<60?`${ago}m ago`:`${Math.round(ago/60)}h ago`, 'ac');
  addPill(m, `${n.signal_count} source${n.signal_count!==1?'s':''}`);
  (n.platforms||[]).forEach(p=>addPill(m,p));

  // Resonance bar
  document.getElementById('rbar').style.width=(n.resonance*100)+'%';
  document.getElementById('rscore').textContent=
    `${(n.resonance*100).toFixed(0)} / 100  ·  half-life ~${n.resonance>0.5?'4–8h':n.resonance>0.25?'8–16h':'16–48h'}`;

  // Bias marker
  const bpos = ((n.bias?.mean||0)+1)/2*100;
  document.getElementById('bmark').style.left=bpos+'%';
  const sp=n.bias?.spread||0;
  document.getElementById('bverdict').textContent = sp>0.45?'⚡ contested':sp>0.22?'varied coverage':'broad consensus';

  // Geographic reach
  const geo=document.getElementById('geobar'); geo.innerHTML='';
  const regions=n.geo_regions||[];
  if(regions.length===0){
    const d=document.createElement('span');
    d.className='georegion'; d.textContent='unknown'; geo.appendChild(d);
  } else {
    const isGlobal=regions.includes('Global');
    regions.filter(r=>r!=='Global').forEach(r=>{
      const d=document.createElement('span');
      d.className='georegion'; d.textContent=r; geo.appendChild(d);
    });
    if(isGlobal){const d=document.createElement('span');d.className='georegion global';d.textContent='global';geo.appendChild(d);}
  }

  // Sources
  const list=document.getElementById('slist'); list.innerHTML='';
  document.getElementById('scount').textContent=(n.sources||[]).length;
  (n.sources||[]).slice(0,10).forEach(s=>{
    const a=document.createElement('a');
    a.className='si'; a.href=s.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
    const dot=document.createElement('div');
    dot.className='sdot'; dot.style.background=PC[s.platform]||PC.default;
    const body=document.createElement('div'); body.className='sb';
    body.innerHTML=`<div class="sout">${s.outlet}</div><div class="shed">${s.headline}</div>`;
    a.appendChild(dot); a.appendChild(body); list.appendChild(a);
  });

  document.getElementById('panel').classList.add('open');
}

function addPill(parent,text,cls){
  const el=document.createElement('div');
  el.className='pill'+(cls?' '+cls:''); el.textContent=text; parent.appendChild(el);
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  selId=null;
  document.querySelectorAll('.ng.sel').forEach(g=>g.classList.remove('sel'));
  document.querySelectorAll('.edge.hi').forEach(e=>{
    e.classList.remove('hi');
    e.style.stroke=''; e.style.strokeWidth='';
  });
}

// ── FILTER BUTTONS ────────────────────────────────────────────────────────────
document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); closePanel(); filter(b.dataset.f);
  });
});

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  initBg();
  if(fnodes.length) render();
});

boot();
</script>
